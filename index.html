<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سرحان بارتي - Sarhan Party</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --gradient: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            --gold: #f59e0b;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --border-color: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 20%),
                              radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 20%);
            overflow-x: hidden;
        }

        /* Top Bar Settings */
        .top-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-btns {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .icon-btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        /* Container Card */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            margin: 80px 0 20px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Social Auth Buttons */
        .social-auth {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-social {
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .btn-google { background: #ffffff; color: #333; }
        .btn-facebook { background: #1877f2; color: #fff; }

        .divider {
            margin: 15px 0;
            display: flex;
            align-items: center;
            color: var(--text-secondary);
        }
        .divider::before, .divider::after {
            content: ""; flex: 1; height: 1px; background: var(--border-color);
        }
        .divider span { padding: 0 10px; font-size: 0.85rem; }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        [dir="ltr"] .form-group { text-align: left; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.1);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        /* Avatar Selection */
        .avatar-section {
            margin: 20px 0;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .avatar-item {
            position: relative;
            border-radius: 16px;
            border: 2px solid transparent;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            text-align: center;
        }

        .avatar-item img {
            width: 100%;
            border-radius: 12px;
            height: 60px;
            object-fit: cover;
        }

        .avatar-item.selected {
            border-color: var(--accent-color);
            background: rgba(139, 92, 246, 0.2);
        }

        .avatar-item.locked::after {
            content: "\f023";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 1.2rem;
        }

        .badge-vip {
            position: absolute;
            top: -5px; right: -5px;
            background: var(--gold);
            color: #000;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: bold;
        }

        .upload-btn {
            margin-top: 10px;
            display: inline-block;
            font-size: 0.85rem;
            color: var(--accent-color);
            cursor: pointer;
            text-decoration: underline;
        }

        /* Primary Action Button */
        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: var(--gradient);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* Room Lobby UI */
        .room-info {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .room-code-display {
            font-size: 1.5rem;
            letter-spacing: 4px;
            font-weight: 900;
            color: var(--accent-color);
            margin: 5px 0;
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .player-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 12px;
        }

        .player-card img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .player-name {
            font-weight: 700;
            flex: 1;
            text-align: right;
        }

        [dir="ltr"] .player-name { text-align: left; }

        .player-badge {
            font-size: 0.75rem;
            background: var(--accent-color);
            padding: 2px 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- Top Settings Bar -->
    <div class="top-bar">
        <div class="logo">
            <i class="fa-solid fa-gamepad"></i>
            <span id="txt-title">سرحان بارتي</span>
        </div>
        <div class="settings-btns">
            <button class="icon-btn" onclick="toggleLanguage()">
                <i class="fa-solid fa-globe"></i>
                <span id="lang-label">EN</span>
            </button>
            <button class="icon-btn" onclick="toggleTheme()">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Screen 1: Registration / Login -->
        <div id="screen-login" class="screen active">
            <h2 id="txt-welcome" style="margin-bottom: 20px;">مرحباً بك في سرحان بارتي!</h2>
            
            <div class="social-auth">
                <button class="btn-social btn-google" onclick="loginWithGoogle()">
                    <i class="fa-brands fa-google"></i> <span id="txt-google">الدخول بواسطة Google</span>
                </button>
                <button class="btn-social btn-facebook" onclick="loginWithFacebook()">
                    <i class="fa-brands fa-facebook-f"></i> <span id="txt-fb">الدخول بواسطة الفيسبوك</span>
                </button>
            </div>

            <div class="divider"><span id="txt-or">أو اللعب كضيف</span></div>

            <div class="form-group">
                <label id="lbl-name" for="username">اسم اللاعب</label>
                <input type="text" id="username" placeholder="أدخل اسمك هنا...">
            </div>

            <div class="avatar-section">
                <label id="lbl-avatar">اختر شخصيتك</label>
                <div class="avatar-grid" id="avatar-grid"></div>
                <label class="upload-btn" for="file-upload" id="lbl-upload">
                    <i class="fa-solid fa-upload"></i> أو قم برفع صورتك الخاصّة
                </label>
                <input type="file" id="file-upload" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            </div>

            <button class="btn-primary" onclick="goToLobby()" id="btn-next">متابعة للردهة</button>
        </div>

        <!-- Screen 2: Room Choice -->
        <div id="screen-lobby" class="screen">
            <h2 id="txt-lobby-title">صالة الانتظار</h2>
            <p style="color: var(--text-secondary); margin-bottom: 20px;" id="txt-lobby-desc">قم بإنشاء غرفة جديدة أو انضم إلى أصدقائك</p>

            <button class="btn-primary" style="margin-bottom: 15px;" onclick="createRoom()" id="btn-create">إنشاء غرفة جديدة</button>

            <div class="divider"><span id="txt-or-room">أو</span></div>

            <div class="form-group">
                <input type="text" id="room-code-input" placeholder="أدخل رقم الغرفة (مثال: 5829)" style="text-align: center; font-size: 1.2rem;">
            </div>
            <button class="btn-primary" style="background: transparent; border: 2px solid var(--accent-color);" onclick="joinRoom()" id="btn-join">الانضمام للغرفة</button>
        </div>

        <!-- Screen 3: Game Room -->
        <div id="screen-room" class="screen">
            <div class="room-info">
                <span id="txt-room-code">رقم الغرفة الخاصة بك:</span>
                <div class="room-code-display" id="display-room-code">----</div>
                <small style="color: var(--text-secondary);" id="txt-max-players">الحد الأقصى: 5 لاعبين في الغرفة</small>
            </div>

            <h3 id="txt-players-in">اللاعبون المتواجدون (<span id="player-count">0</span>/5)</h3>
            <div class="players-list" id="players-list"></div>

            <button class="btn-primary" id="btn-start-game" onclick="startGame()">بدء اللعبة الآن!</button>
        </div>

    </div>

    <!-- Firebase SDK (Modular Modern Import) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, FacebookAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2WWgfNCzg3LQ2Nqkp21IsbmbcQzlBDMw",
            authDomain: "salah-52496.firebaseapp.com",
            databaseURL: "https://salah-52496-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "salah-52496",
            storageBucket: "salah-52496.firebasestorage.app",
            messagingSenderId: "123427587326",
            appId: "1:123427587326:web:3b3f86047fb30923f0f38b",
            measurementId: "G-4SMPNYP7LQ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        // جعل الدوال متاحة للمستند
        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                document.getElementById('username').value = result.user.displayName || "لاعب جوجل";
                if(result.user.photoURL) {
                    window.selectedAvatar = result.user.photoURL;
                }
                alert("تم تسجيل الدخول بنجاح عبر Google!");
            } catch (error) {
                console.error("Google Auth Error:", error);
                alert("حدث خطأ أثناء التسجيل بـ Google: " + error.message);
            }
        };

        window.loginWithFacebook = async function() {
            const provider = new FacebookAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                document.getElementById('username').value = result.user.displayName || "لاعب فيسبوك";
                if(result.user.photoURL) {
                    window.selectedAvatar = result.user.photoURL;
                }
                alert("تم تسجيل الدخول بنجاح عبر الفيسبوك!");
            } catch (error) {
                console.error("Facebook Auth Error:", error);
                alert("حدث خطأ أثناء التسجيل بـ Facebook: " + error.message);
            }
        };

        window.createRoomInFirebase = function(roomCode, playerData) {
            const roomRef = ref(database, 'rooms/' + roomCode);
            set(roomRef, {
                status: "waiting",
                createdAt: Date.now()
            });

            const playersRef = ref(database, `rooms/${roomCode}/players`);
            const newPlayerRef = push(playersRef);
            set(newPlayerRef, playerData);

            listenToRoom(roomCode);
        };

        window.joinRoomInFirebase = async function(roomCode, playerData) {
            const roomRef = ref(database, 'rooms/' + roomCode);
            const snapshot = await get(roomRef);

            if (!snapshot.exists()) {
                alert("عذراً، هذه الغرفة غير موجودة!");
                return false;
            }

            const playersRef = ref(database, `rooms/${roomCode}/players`);
            const playersSnap = await get(playersRef);
            if(playersSnap.exists()) {
                const count = Object.keys(playersSnap.val()).length;
                if(count >= 5) {
                    alert(translations[currentLang].alertFull);
                    return false;
                }
            }

            const newPlayerRef = push(playersRef);
            await set(newPlayerRef, playerData);
            listenToRoom(roomCode);
            return true;
        };

        function listenToRoom(roomCode) {
            const playersRef = ref(database, `rooms/${roomCode}/players`);
            onValue(playersRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const playersArr = Object.values(data);
                    window.renderRoomPlayers(playersArr);
                }
            });
        }
    </script>

    <script>
        const translations = {
            ar: {
                title: "سرحان بارتي", welcome: "مرحباً بك في سرحان بارتي!", google: "الدخول بواسطة Google", fb: "الدخول بواسطة الفيسبوك",
                or: "أو اللعب كضيف", lblName: "اسم اللاعب", lblAvatar: "اختر شخصيتك", lblUpload: "أو قم برفع صورتك الخاصّة",
                btnNext: "متابعة للردهة", lobbyTitle: "صالة الانتظار", lobbyDesc: "قم بإنشاء غرفة جديدة أو انضم إلى أصدقائك",
                btnCreate: "إنشاء غرفة جديدة", orRoom: "أو", btnJoin: "الانضمام للغرفة", roomCode: "رقم الغرفة الخاصة بك:",
                maxPlayers: "الحد الأقصى: 5 لاعبين في الغرفة", playersIn: "اللاعبون المتواجدون", btnStart: "بدء اللعبة الآن!",
                alertName: "يرجى كتابة اسمك أولاً!", alertRoom: "يرجى إدخال رقم الغرفة!", alertFull: "عذراً! الغرفة ممتلئة (الحد الأقصى 5 لاعبين)",
                unlockPrompt: "هذه الشخصية مدفوعة/مقفولة! هل ترغب في فتحها مقابل 1.99$؟"
            },
            en: {
                title: "Sarhan Party", welcome: "Welcome to Sarhan Party!", google: "Sign in with Google", fb: "Sign in with Facebook",
                or: "Or play as guest", lblName: "Player Name", lblAvatar: "Choose your avatar", lblUpload: "Or upload your custom picture",
                btnNext: "Continue to Lobby", lobbyTitle: "Lobby", lobbyDesc: "Create a new room or join your friends",
                btnCreate: "Create New Room", orRoom: "OR", btnJoin: "Join Room", roomCode: "Your Room Code:",
                maxPlayers: "Max: 5 players per room", playersIn: "Players Joined", btnStart: "Start Game Now!",
                alertName: "Please enter your name first!", alertRoom: "Please enter a room code!", alertFull: "Sorry! Room is full (Max 5 players)",
                unlockPrompt: "This character is premium! Would you like to unlock it for $1.99?"
            }
        };

        const avatars = [
            { id: 1, src: 'https://api.dicebear.com/7.x/bottts/svg?seed=1', paid: false },
            { id: 2, src: 'https://api.dicebear.com/7.x/bottts/svg?seed=2', paid: false },
            { id: 3, src: 'https://api.dicebear.com/7.x/bottts/svg?seed=VIP1', paid: true },
            { id: 4, src: 'https://api.dicebear.com/7.x/bottts/svg?seed=VIP2', paid: true }
        ];

        let currentLang = 'ar';
        window.selectedAvatar = avatars[0].src;
        let username = '';
        let currentRoom = null;

        window.onload = () => { renderAvatars(); };

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                icon.className = 'fa-solid fa-sun';
            } else {
                html.setAttribute('data-theme', 'dark');
                icon.className = 'fa-solid fa-moon';
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;
            document.getElementById('lang-label').innerText = currentLang === 'ar' ? 'EN' : 'عربي';

            const t = translations[currentLang];
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-welcome').innerText = t.welcome;
            document.getElementById('txt-google').innerText = t.google;
            document.getElementById('txt-fb').innerText = t.fb;
            document.getElementById('txt-or').innerText = t.or;
            document.getElementById('lbl-name').innerText = t.lblName;
            document.getElementById('lbl-avatar').innerText = t.lblAvatar;
            document.getElementById('lbl-upload').innerHTML = `<i class="fa-solid fa-upload"></i> ${t.lblUpload}`;
            document.getElementById('btn-next').innerText = t.btnNext;
            document.getElementById('txt-lobby-title').innerText = t.lobbyTitle;
            document.getElementById('txt-lobby-desc').innerText = t.lobbyDesc;
            document.getElementById('btn-create').innerText = t.btnCreate;
            document.getElementById('txt-or-room').innerText = t.orRoom;
            document.getElementById('btn-join').innerText = t.btnJoin;
            document.getElementById('txt-room-code').innerText = t.roomCode;
            document.getElementById('txt-max-players').innerText = t.maxPlayers;
            document.getElementById('btn-start-game').innerText = t.btnStart;
        }

        function renderAvatars() {
            const grid = document.getElementById('avatar-grid');
            grid.innerHTML = '';
            avatars.forEach((av, index) => {
                const item = document.createElement('div');
                item.className = `avatar-item ${index === 0 ? 'selected' : ''} ${av.paid ? 'locked' : ''}`;
                item.onclick = () => selectAvatar(av, item);
                item.innerHTML = `<img src="${av.src}" alt="avatar">${av.paid ? '<span class="badge-vip">VIP</span>' : ''}`;
                grid.appendChild(item);
            });
        }

        function selectAvatar(av, element) {
            if (av.paid) {
                if (confirm(translations[currentLang].unlockPrompt)) {
                    av.paid = false;
                    element.classList.remove('locked');
                } else { return; }
            }
            document.querySelectorAll('.avatar-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            window.selectedAvatar = av.src;
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    window.selectedAvatar = event.target.result;
                    alert("تم رفع الصورة بنجاح!");
                };
                reader.readAsDataURL(file);
            }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goToLobby() {
            username = document.getElementById('username').value.trim();
            if (!username) {
                alert(translations[currentLang].alertName);
                return;
            }
            showScreen('screen-lobby');
        }

        function createRoom() {
            currentRoom = Math.floor(1000 + Math.random() * 9000).toString();
            const playerData = { name: username, avatar: window.selectedAvatar, host: true };
            document.getElementById('display-room-code').innerText = currentRoom;
            
            window.createRoomInFirebase(currentRoom, playerData);
            showScreen('screen-room');
        }

        async function joinRoom() {
            const code = document.getElementById('room-code-input').value.trim();
            if (!code) {
                alert(translations[currentLang].alertRoom);
                return;
            }
            currentRoom = code;
            const playerData = { name: username, avatar: window.selectedAvatar, host: false };
            
            const success = await window.joinRoomInFirebase(currentRoom, playerData);
            if (success) {
                document.getElementById('display-room-code').innerText = currentRoom;
                showScreen('screen-room');
            }
        }

        window.renderRoomPlayers = function(playersList) {
            document.getElementById('player-count').innerText = playersList.length;
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            playersList.forEach(p => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.innerHTML = `
                    <img src="${p.avatar}" alt="avatar">
                    <span class="player-name">${p.name}</span>
                    ${p.host ? '<span class="player-badge">المضيف</span>' : ''}
                `;
                list.appendChild(card);
            });
        };

        function startGame() {
            alert("جاري بدء اللعبة مع جميع اللاعبين في الغرفة!");
        }
    </script>
</body>
</html>
