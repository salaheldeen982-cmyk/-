<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سرحان بارتي - Sarhan Party</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --accent-color: #8b5cf6;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --gradient: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            --gold: #f59e0b;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --accent-color: #6366f1;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --border-color: rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; transition: all 0.3s ease; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .top-bar { position: fixed; top: 20px; right: 20px; left: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo { font-size: 1.8rem; font-weight: 900; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .settings-btns { display: flex; gap: 10px; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px 15px; border-radius: 12px; cursor: pointer; font-weight: 600; }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 520px;
            text-align: center;
            margin: 80px 0 20px;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s ease-in-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 20px; text-align: right; }
        [dir="ltr"] .form-group { text-align: left; }
        
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); }

        input[type="text"] {
            width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2); color: var(--text-color); font-size: 1rem; outline: none;
        }

        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; max-height: 200px; overflow-y: auto; padding: 5px; }
        .avatar-item { position: relative; border-radius: 16px; border: 2px solid transparent; cursor: pointer; background: rgba(255,255,255,0.05); padding: 5px; }
        .avatar-item img { width: 100%; border-radius: 12px; height: 55px; object-fit: cover; }
        .avatar-item.selected { border-color: var(--accent-color); background: rgba(139, 92, 246, 0.2); }

        .upload-box {
            border: 2px dashed var(--border-color); border-radius: 12px; padding: 12px; margin-top: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-secondary); font-size: 0.9rem;
        }

        .btn-primary {
            width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--gradient);
            color: white; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 10px;
        }

        .record-btn {
            background: #ef4444; color: white; border: none; border-radius: 50%; width: 75px; height: 75px;
            font-size: 1.8rem; cursor: pointer; margin: 15px 0;
        }
        .record-btn.recording { animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">Sarhan Party</div>
        <div class="settings-btns">
            <button class="icon-btn" onclick="toggleLanguage()"><i class="fa-solid fa-globe"></i> <span id="lang-btn-text">EN</span></button>
            <button class="icon-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </div>

    <div class="container">
        <!-- Screen 1: Login & Custom Avatar -->
        <div id="screen-login" class="screen active">
            <h2 id="txt-welcome" style="margin-bottom: 20px;">مرحباً بك في اللعبة!</h2>
            <div class="form-group">
                <label id="lbl-username" for="username">اسم اللاعب (15 حرف كحد أقصى)</label>
                <input type="text" id="username" maxlength="15" placeholder="أدخل اسمك هنا...">
            </div>
            
            <div class="avatar-section">
                <label id="lbl-avatar">اختر شخصيتك أو ارفع صورتك الخاصة</label>
                <div class="avatar-grid" id="avatar-grid"></div>
                
                <div class="upload-box" onclick="document.getElementById('custom-avatar-input').click()">
                    <i class="fa-solid fa-upload"></i>
                    <span id="txt-upload">رفع صورة شخصية مخصصة</span>
                    <input type="file" id="custom-avatar-input" accept="image/*" style="display:none;" onchange="handleCustomAvatar(this)">
                </div>
            </div>
            <button class="btn-primary" id="btn-continue" onclick="goToLobby()">متابعة للردهة</button>
        </div>

        <!-- Screen 2: Lobby -->
        <div id="screen-lobby" class="screen">
            <h2 id="txt-lobby-title">صالة الانتظار</h2>
            <button class="btn-primary" style="margin-bottom: 20px;" id="btn-create-room" onclick="createRoom()">إنشاء غرفة جديدة</button>
            <div class="form-group">
                <input type="text" id="room-code-input" placeholder="أدخل رقم الغرفة" style="text-align: center; font-size: 1.2rem;">
            </div>
            <button class="btn-primary" style="background: transparent; border: 2px solid var(--accent-color);" id="btn-join-room" onclick="joinRoom()">الانضمام للغرفة</button>
        </div>

        <!-- Screen 3: Game Room -->
        <div id="screen-room" class="screen">
            <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                <span id="txt-room-code">رقم الغرفة:</span>
                <div style="font-size: 1.5rem; font-weight: 900; color: var(--accent-color);" id="display-room-code">----</div>
            </div>
            <button class="btn-primary" id="btn-start-game" onclick="startGameHost()">بدء اللعبة الآن</button>
        </div>

        <!-- Screen 4: Game Arena -->
        <div id="screen-game" class="screen">
            <div style="background: rgba(0, 0, 0, 0.25); border-radius: 16px; padding: 15px; margin-bottom: 15px;">
                <div style="font-size: 1.1rem; font-weight: 700; color: var(--gold);" id="stage-indicator">المرحلة 1 / 9</div>
                <h3 id="stage-title">استمع للصوت وقم بتقليده!</h3>
            </div>
            <div style="margin: 20px 0;">
                <button class="btn-primary" style="margin-bottom: 15px;" id="btn-play-sound" onclick="playTargetSound()">
                    <i class="fa-solid fa-volume-high"></i> <span id="txt-play-sound">تشغيل الصوت المطلوب</span>
                </button>
                <button class="record-btn" id="btn-record" onclick="startRecording3s()">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <div id="recording-timer" style="font-size: 1.2rem; font-weight: bold; color: #ef4444; margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            ar: {
                welcome: "مرحباً بك في اللعبة!",
                lblUsername: "اسم اللاعب (15 حرف كحد أقصى)",
                lblAvatar: "اختر شخصيتك أو ارفع صورتك الخاصة",
                upload: "رفع صورة شخصية مخصصة",
                continue: "متابعة للردهة",
                lobbyTitle: "صالة الانتظار",
                createRoom: "إنشاء غرفة جديدة",
                joinRoom: "الانضمام للغرفة",
                roomCode: "رقم الغرفة:",
                startGame: "بدء اللعبة الآن",
                playSound: "تشغيل الصوت المطلوب",
                langBtn: "EN"
            },
            en: {
                welcome: "Welcome to the Game!",
                lblUsername: "Player Name (15 chars max)",
                lblAvatar: "Choose Avatar or Upload Custom Photo",
                upload: "Upload Custom Photo",
                continue: "Continue to Lobby",
                lobbyTitle: "Waiting Lobby",
                createRoom: "Create New Room",
                joinRoom: "Join Room",
                roomCode: "Room Code:",
                startGame: "Start Game Now",
                playSound: "Play Target Sound",
                langBtn: "عربي"
            }
        };

        let currentLang = 'ar';
        const realSoundList = [
            { id: 1, name: "صوت: Huh? 🤔", src: "./universfield-confused-male-voice-huh-352694.mp3" },
            { id: 2, name: "عبارة: Game Over 🎮", src: "./universfield-game-over-deep-male-voice-clip-352695.mp3" },
            { id: 3, name: "عبارة: Good Boy! 🐶", src: "./universfield-good-boy-male-voice-praise-352699.mp3" },
            { id: 4, name: "عبارة: You Stupid Cat! 🐱", src: "./universfield-angry-male-voice-you-stupid-cat-352692.mp3" },
            { id: 5, name: "عبارة: Darkness Hunts Us 🌑", src: "./originalvo-medieval-gamer-voice-darkness-hunts-us-what-youx27ve-learned-stay-226596.mp3" },
            { id: 6, name: "صوت: Wow! ✨", src: "./universfield-male-wow-reaction-352683.mp3" },
            { id: 7, name: "عبارة: Let's Go! 🚀", src: "./universfield-male-voice-letx27s-go-352481.mp3" },
            { id: 8, name: "عبارة: Oh Fuck! 💥", src: "./freesound_community-084320_adult-male-says-quotoh-fuckquot-voice-over-actor-curse-slang-profanity-pain-anger-frustration-47363.mp3" },
            { id: 9, name: "صوت: شهقة إندهام 😲", src: "./freesound_community-male-gasp-1-7183.mp3" }
        ];

        const defaultAvatars = [
            'https://api.dicebear.com/7.x/bottts/svg?seed=1',
            'https://api.dicebear.com/7.x/bottts/svg?seed=2',
            'https://api.dicebear.com/7.x/bottts/svg?seed=3',
            'https://api.dicebear.com/7.x/bottts/svg?seed=4'
        ];

        let selectedAvatar = defaultAvatars[0];
        let currentStageIndex = 0;
        let currentAudioObject = null;

        window.onload = () => {
            const grid = document.getElementById('avatar-grid');
            defaultAvatars.forEach((src, idx) => {
                grid.innerHTML += `
                    <div class="avatar-item ${idx===0?'selected':''}" onclick="selectAv(this, '${src}')">
                        <img src="${src}">
                    </div>`;
            });
        };

        function selectAv(el, src) {
            document.querySelectorAll('.avatar-item').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            selectedAvatar = src;
        }

        function handleCustomAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedAvatar = e.target.result;
                    alert(currentLang === 'ar' ? "تم تحميل صورتك بنجاح!" : "Photo uploaded successfully!");
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', currentLang);

            const t = translations[currentLang];
            document.getElementById('txt-welcome').innerText = t.welcome;
            document.getElementById('lbl-username').innerText = t.lblUsername;
            document.getElementById('lbl-avatar').innerText = t.lblAvatar;
            document.getElementById('txt-upload').innerText = t.upload;
            document.getElementById('btn-continue').innerText = t.continue;
            document.getElementById('txt-lobby-title').innerText = t.lobbyTitle;
            document.getElementById('btn-create-room').innerText = t.createRoom;
            document.getElementById('btn-join-room').innerText = t.joinRoom;
            document.getElementById('txt-room-code').innerText = t.roomCode;
            document.getElementById('btn-start-game').innerText = t.startGame;
            document.getElementById('txt-play-sound').innerText = t.playSound;
            document.getElementById('lang-btn-text').innerText = t.langBtn;
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goToLobby() {
            const username = document.getElementById('username').value.trim();
            if(!username) return alert(currentLang === 'ar' ? "يرجى إدخال اسمك!" : "Please enter your name!");
            showScreen('screen-lobby');
        }

        function createRoom() {
            document.getElementById('display-room-code').innerText = Math.floor(1000 + Math.random() * 9000);
            showScreen('screen-room');
        }

        function joinRoom() { showScreen('screen-room'); }
        function startGameHost() { showScreen('screen-game'); setupStage(0); }

        function setupStage(index) {
            currentStageIndex = index;
            document.getElementById('stage-indicator').innerText = `${currentLang === 'ar' ? 'المرحلة' : 'Stage'} ${index + 1} / ${realSoundList.length}`;
            document.getElementById('stage-title').innerText = realSoundList[index].name;
        }

        function playTargetSound() {
            const currentSound = realSoundList[currentStageIndex];
            if (currentSound && currentSound.src) {
                if (currentAudioObject) currentAudioObject.pause();
                currentAudioObject = new Audio(currentSound.src);
                currentAudioObject.play().catch(err => {
                    alert(currentLang === 'ar' ? "تأكد من تواجد الملفات بنفس الاسم في المستودع." : "Ensure files exist in repository.");
                });
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>
